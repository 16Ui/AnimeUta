limit_req_zone $binary_remote_addr zone=animeuta_login:10m rate=10r/m;

server {
    listen 80;
    server_name server.example.invalid;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
    }
    location / { return 301 https://server.example.invalid$request_uri; }
}

server {
    listen 443 ssl;
    server_name server.example.invalid;
    ssl_certificate /etc/letsencrypt/live/server.example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/server.example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AnimeUtaTLS:10m;
    ssl_session_tickets off;
    root /opt/animeuta/shared/web-current;
    index index.html;
    client_max_body_size 120m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options SAMEORIGIN always;

    location = /api/v1/auth/login {
        limit_req zone=animeuta_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }
    location = /updates.json {
        root /opt/animeuta/shared/client-release-current;
        try_files $uri =404;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location ^~ /downloads/ {
        root /opt/animeuta/shared/client-release-current;
        try_files $uri =404;
        types { }
        default_type application/octet-stream;
        add_header Content-Disposition attachment always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options SAMEORIGIN always;
    }
    location = /health { proxy_pass http://127.0.0.1:8080; }
    location ~ /\. { deny all; }
    location / { try_files $uri $uri/ /index.html; }
}
