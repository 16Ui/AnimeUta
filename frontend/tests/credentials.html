<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Credential persistence regression</title>
<body><h1>Credential persistence regression</h1><button id="run">Run storage tests</button><pre id="output"></pre>
<script type="module">
import { saveLogin, loadSavedLogin, removeSavedLogin } from '/src/lib/savedCredentials.ts'
const first = 'https://credential-regression.invalid/a'
const second = 'https://credential-regression.invalid/b'
const output = document.querySelector('#output')
function check(value, message) { if (!value) throw new Error(message); output.textContent += 'PASS ' + message + '\n' }
document.querySelector('#run').onclick = async () => {
  output.textContent = ''
  try {
    await removeSavedLogin(first); await removeSavedLogin(second)
    await saveLogin(first, ' TEST@example.invalid ', 'test-only-password-123')
    check((await loadSavedLogin(first)).email === 'test@example.invalid', 'normalized email restored')
    check((await loadSavedLogin(first)).password === 'test-only-password-123', 'password round trip')
    check(await loadSavedLogin(second) === null, 'different server has no credentials')
    await saveLogin(second, 'second@example.invalid', 'second-test-password')
    await saveLogin(first, 'test@example.invalid', 'changed-test-password')
    check((await loadSavedLogin(first)).password === 'changed-test-password', 'password replacement')
    check((await loadSavedLogin(second)).password === 'second-test-password', 'other server unchanged')
    await removeSavedLogin(first)
    check(await loadSavedLogin(first) === null, 'explicit removal')
    check((await loadSavedLogin(second)).password === 'second-test-password', 'removal isolated by server')
    sessionStorage.setItem('credential-regression-reload', '1')
    location.reload()
  } catch (error) { output.textContent += 'FAIL ' + error.message }
}
if (sessionStorage.getItem('credential-regression-reload')) {
  try {
    check((await loadSavedLogin(second)).password === 'second-test-password', 'password survives page reload')
    await removeSavedLogin(second)
    check(await loadSavedLogin(second) === null, 'test records cleaned up')
    output.textContent += 'ALL STORAGE TESTS PASSED (10 assertions)'
  } catch (error) { output.textContent += 'FAIL ' + error.message }
  finally { sessionStorage.removeItem('credential-regression-reload') }
}
</script></body></html>
